name: Seqera access

on:
  pull_request:
    paths:
      - "terraform/seqera-access/**"
      - ".github/workflows/seqera-access.yml"
      - ".github/CODEOWNERS"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seqera-access.yml"
      - ".github/CODEOWNERS"
      - "terraform/seqera-access/**/*.tf"
      - "terraform/seqera-access/members.json"
      - "terraform/seqera-access/.terraform.lock.hcl"
      - "terraform/seqera-access/scripts/**"
      - "terraform/seqera-access/tests/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to plan (manifest-only changes)
        required: false
        type: string
      enable_pr_plan:
        description: Confirm a protected plan for that pull request
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('seqera-access-pr-{0}', github.event.pull_request.number) || 'seqera-access-state' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate membership manifest
        run: python terraform/seqera-access/scripts/validate_manifest.py
      - name: Run manifest and trust-boundary tests
        run: python -m unittest discover -s terraform/seqera-access/tests -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Validate Terraform configuration without credentials
        working-directory: terraform/seqera-access
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly >/dev/null 2>&1 || { echo "Terraform initialization failed."; exit 1; }
          terraform validate -no-color >/dev/null 2>&1 || { echo "Terraform configuration validation failed."; exit 1; }
          terraform test -no-color

  protected-plan:
    if: >-
      (github.event_name == 'push' && vars.SEQERA_ACCESS_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.enable_pr_plan == true && inputs.pr_number != '')
    runs-on: ubuntu-latest
    environment: seqera-access-plan
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      SEQERA_ACCESS_ENABLED: ${{ vars.SEQERA_ACCESS_ENABLED }}
      SEQERA_ACCESS_ALLOW_DELETIONS: ${{ vars.SEQERA_ACCESS_ALLOW_DELETIONS }}
      SEQERA_STATE_BUCKET: ${{ vars.SEQERA_STATE_BUCKET }}
      SEQERA_STATE_KEY: ${{ vars.SEQERA_STATE_KEY }}
      SEQERA_STATE_REGION: ${{ vars.SEQERA_STATE_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.SEQERA_AWS_ROLE_TO_ASSUME }}
    outputs:
      plan_fingerprint: ${{ steps.plan.outputs.plan_fingerprint }}
      has_deletions: ${{ steps.plan.outputs.has_deletions }}
    steps:
      - name: Enforce trusted dispatch ref and apply gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Run this workflow from main."; exit 1; }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record trusted source revision
        run: |
          revision="$(git rev-parse HEAD)"
          echo "Trusted Terraform revision: $revision"
          echo "Trusted Terraform revision: \`$revision\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate merged membership manifest
        if: github.event_name == 'push'
        run: python terraform/seqera-access/scripts/validate_manifest.py
      - name: Fetch and verify PR manifest only
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python - "$PR_NUMBER" <<'PY'
          import json, os, re, subprocess, sys
          pr = sys.argv[1]
          if not re.fullmatch(r"[1-9][0-9]*", pr):
              raise SystemExit("Invalid pull request number.")
          repo = os.environ["GITHUB_REPOSITORY"]
          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)
          record = json.loads(gh("api", f"repos/{repo}/pulls/{pr}"))
          if record.get("state") != "open" or record.get("base", {}).get("ref") != "main":
              raise SystemExit("Pull request must be open and target main.")
          head_record = record.get("head", {})
          head = head_record.get("sha", "")
          head_repo = (head_record.get("repo") or {}).get("full_name", "")
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("Could not verify pull request head.")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", head_repo):
              raise SystemExit("Could not verify pull request source repository.")
          paths = gh("api", f"repos/{repo}/pulls/{pr}/files", "--paginate", "--jq", ".[].filename")
          changed = [line for line in paths.splitlines() if line]
          if changed != ["terraform/seqera-access/members.json"]:
              raise SystemExit("Protected PR planning accepts changes to members.json only.")
          content = json.loads(gh("api", f"repos/{head_repo}/contents/terraform/seqera-access/members.json?ref={head}"))
          import base64
          with open(os.path.join(os.environ["RUNNER_TEMP"], "members.json"), "wb") as output:
              output.write(base64.b64decode(content["content"], validate=False))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "verified-pr.json"), "w") as output:
              json.dump({"number": int(pr), "head": head}, output)
          print(f"Planning manifest from PR #{pr} at {head}.")
          PY
          python terraform/seqera-access/scripts/validate_manifest.py "$RUNNER_TEMP/members.json"
          cp "$RUNNER_TEMP/members.json" terraform/seqera-access/members.json
          python - "$RUNNER_TEMP/verified-pr.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"Reviewed PR input: #{record['number']} at `{record['head']}`")
          PY
      - name: Confirm live apply gate for main push
        if: github.event_name == 'push'
        run: test "$SEQERA_ACCESS_ENABLED" = "true" || { echo "Seqera access is disabled by repository variable."; exit 1; }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.SEQERA_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.SEQERA_STATE_REGION }}
      - name: Plan and summarize the trusted revision
        id: plan
        env:
          TF_VAR_org_id: ${{ secrets.SEQERA_ORG_ID }}
          TF_VAR_workspace_id: ${{ secrets.SEQERA_WORKSPACE_ID }}
          TOWER_ACCESS_TOKEN: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          TF_VAR_identity_map: ${{ secrets.SEQERA_IDENTITY_MAP }}
        working-directory: terraform/seqera-access
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/seqera-access.XXXXXX")"
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$SEQERA_STATE_BUCKET" \
            -backend-config="key=$SEQERA_STATE_KEY" \
            -backend-config="region=$SEQERA_STATE_REGION" >"$work/init.log" 2>&1 || { echo "Terraform initialization failed; diagnostics were withheld from public logs."; exit 1; }
          terraform plan -input=false -no-color -out="$work/plan.tfplan" >"$work/plan.log" 2>&1 || { echo "Terraform planning failed; diagnostics were withheld from public logs."; exit 1; }
          terraform show -json "$work/plan.tfplan" >"$work/plan.json" 2>"$work/show.log" || { echo "Terraform plan summary failed; diagnostics were withheld from public logs."; exit 1; }
          plan_summary="$(python scripts/summarize_plan.py --emit-github-output <"$work/plan.json")"
          plan_fingerprint="$(python scripts/plan_fingerprint.py <"$work/plan.json")"
          echo "plan_fingerprint=$plan_fingerprint" >> "$GITHUB_OUTPUT"
          printf '### Terraform plan for `%s`\n\n%s\n' "$(git rev-parse HEAD)" "$plan_summary" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_fingerprint=$plan_fingerprint (canonical plan JSON; top-level timestamp omitted)" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan completed for the trusted revision."

  apply-reviewed-plan:
    if: github.event_name == 'push' && vars.SEQERA_ACCESS_ENABLED == 'true'
    needs: protected-plan
    runs-on: ubuntu-latest
    environment: seqera-access-apply
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      SEQERA_ACCESS_ENABLED: ${{ vars.SEQERA_ACCESS_ENABLED }}
      SEQERA_ACCESS_ALLOW_DELETIONS: ${{ vars.SEQERA_ACCESS_ALLOW_DELETIONS }}
      SEQERA_STATE_BUCKET: ${{ vars.SEQERA_STATE_BUCKET }}
      SEQERA_STATE_KEY: ${{ vars.SEQERA_STATE_KEY }}
      SEQERA_STATE_REGION: ${{ vars.SEQERA_STATE_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.SEQERA_AWS_ROLE_TO_ASSUME }}
      EXPECTED_PLAN_FINGERPRINT: ${{ needs.protected-plan.outputs.plan_fingerprint }}
      EXPECTED_PLAN_HAS_DELETIONS: ${{ needs.protected-plan.outputs.has_deletions }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate merged membership manifest
        run: python terraform/seqera-access/scripts/validate_manifest.py
      - name: Check deletion approval gate
        run: |
          if [ "$EXPECTED_PLAN_HAS_DELETIONS" = "true" ] && [ "$SEQERA_ACCESS_ALLOW_DELETIONS" != "true" ]; then
            echo "The reviewed plan contains deletions. Enable the protected deletion gate after review, then rerun."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.SEQERA_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.SEQERA_STATE_REGION }}
      - name: Verify reviewed plan, then apply the matching saved plan
        env:
          TF_VAR_org_id: ${{ secrets.SEQERA_ORG_ID }}
          TF_VAR_workspace_id: ${{ secrets.SEQERA_WORKSPACE_ID }}
          TOWER_ACCESS_TOKEN: ${{ secrets.SEQERA_ACCESS_TOKEN }}
          TF_VAR_identity_map: ${{ secrets.SEQERA_IDENTITY_MAP }}
        working-directory: terraform/seqera-access
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PLAN_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || { echo "No valid reviewed plan fingerprint was provided."; exit 1; }
          work="$(mktemp -d "$RUNNER_TEMP/seqera-access-apply.XXXXXX")"
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$SEQERA_STATE_BUCKET" \
            -backend-config="key=$SEQERA_STATE_KEY" \
            -backend-config="region=$SEQERA_STATE_REGION" >"$work/init.log" 2>&1 || { echo "Terraform initialization failed; diagnostics were withheld from public logs."; exit 1; }
          terraform plan -input=false -no-color -out="$work/plan.tfplan" >"$work/plan.log" 2>&1 || { echo "Terraform planning failed; diagnostics were withheld from public logs."; exit 1; }
          terraform show -json "$work/plan.tfplan" >"$work/plan.json" 2>"$work/show.log" || { echo "Terraform plan summary failed; diagnostics were withheld from public logs."; exit 1; }
          actual_fingerprint="$(python scripts/plan_fingerprint.py <"$work/plan.json")"
          if [ "$actual_fingerprint" != "$EXPECTED_PLAN_FINGERPRINT" ]; then
            echo "The live plan differs from the reviewed plan; no changes were applied. Rerun for a fresh review."
            exit 1
          fi
          if ! ALLOW_DELETIONS="$SEQERA_ACCESS_ALLOW_DELETIONS" python scripts/summarize_plan.py --enforce-deletion-gate <"$work/plan.json"; then
            echo "Plan contains deletions; the protected deletion gate must be enabled after review."
            exit 1
          fi
          if [ "$SEQERA_ACCESS_ENABLED" != "true" ]; then
            echo "Seqera access apply gate is no longer enabled; no changes were applied."
            exit 1
          fi
          terraform apply -input=false -no-color "$work/plan.tfplan" >"$work/apply.log" 2>&1 || { echo "Terraform apply failed; diagnostics were withheld from public logs."; exit 1; }
          echo "Applied the reviewed saved plan for revision $GITHUB_SHA."
